name: Go
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.7'
      - run: go build ./...
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.8.0
      - run: make test
      - run: go test -race -count=1 -p 1 -timeout 10m ./pkg/usecases
